apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: mvp-oficina-api-hpa
  namespace: staging
  labels:
    app: mvp-oficina-api
    environment: staging
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: mvp-oficina-api
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70