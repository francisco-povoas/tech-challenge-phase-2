apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: observability
data:
  prometheus.yaml: |
    apiVersion: 1
    datasources:
    - name: Prometheus
      type: prometheus
      access: proxy
      url: http://prometheus.observability.svc.cluster.local:9090
      isDefault: true
      editable: true

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:latest
          ports:
            - containerPort: 3000
          volumeMounts:
            - name: grafana-datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: grafana-dashboards
              mountPath: /etc/grafana/provisioning/dashboards
            - name: grafana-dashboards
              mountPath: /var/lib/grafana/dashboards
      volumes:
        - name: grafana-datasources
          configMap:
            name: grafana-datasources
        - name: grafana-dashboards
          configMap:
            name: grafana-dashboards

---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: observability
spec:
  type: NodePort
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30030

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: observability
data:
  provider.yaml: |
    apiVersion: 1
    providers:
      - name: 'default'
        orgId: 1
        folder: ''
        type: file
        options:
          path: /var/lib/grafana/dashboards

  observabilidade-api-dashboard.json: |
    {
      "annotations": { "list": [] },
      "panels": [
        {
          "id": 1,
          "gridPos": { "x": 0, "y": 0, "w": 12, "h": 6 },
          "title": "P95 - Latência da autenticação",
          "type": "timeseries",
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(http_server_duration_milliseconds_bucket{http_target=\"/api/v1/auth/token\",http_method=\"POST\"}[5m])) by (le))",
              "refId": "A"
            }
          ]
        },
        {
          "id": 2,
          "gridPos": { "x": 12, "y": 0, "w": 12, "h": 6 },
          "title": "P99 - Latência da autenticação",
          "type": "timeseries",
          "targets": [
            {
              "expr": "histogram_quantile(0.99, sum(rate(http_server_duration_milliseconds_bucket{http_target=\"/api/v1/auth/token\",http_method=\"POST\"}[5m])) by (le))",
              "refId": "A"
            }
          ]
        },
        {
          "id": 3,
          "gridPos": { "x": 0, "y": 6, "w": 12, "h": 5 },
          "title": "Requisições de autenticação por segundo",
          "type": "timeseries",
          "targets": [
            {
              "expr": "sum(rate(http_server_duration_milliseconds_count{http_target=\"/api/v1/auth/token\",http_method=\"POST\"}[1m]))",
              "refId": "A",
              "legendFormat": "req/s"
            }
          ]
        },
        {
          "id": 4,
          "gridPos": { "x": 12, "y": 6, "w": 12, "h": 5 },
          "title": "Total acumulado de autenticações (1h)",
          "type": "stat",
          "targets": [
            {
              "expr": "sum(increase(http_server_duration_milliseconds_count{http_target=\"/api/v1/auth/token\",http_method=\"POST\"}[1h]))",
              "refId": "A"
            }
          ]
        },
        {
          "id": 5,
          "gridPos": { "x": 0, "y": 11, "w": 12, "h": 5 },
          "title": "Erros de autenticação por segundo",
          "type": "timeseries",
          "targets": [
            {
              "expr": "sum(rate(http_server_duration_milliseconds_count{http_target=\"/api/v1/auth/token\",http_method=\"POST\", http_status_code=~\"4..|5..\"}[1m]))",
              "refId": "A",
              "legendFormat": "errors/s"
            }
          ]
        },
        {
          "id": 6,
          "gridPos": { "x": 12, "y": 11, "w": 12, "h": 5 },
          "title": "Requisições HTTP ativas",
          "type": "stat",
          "targets": [
            {
              "expr": "sum(http_server_active_requests)",
              "refId": "A"
            }
          ]
        },
        {
          "id": 7,
          "gridPos": { "x": 0, "y": 16, "w": 24, "h": 5 },
          "title": "Conexões DB em uso",
          "type": "stat",
          "targets": [
            {
              "expr": "sum(db_client_connections_usage{state=\"used\"})",
              "refId": "A"
            }
          ]
        }
      ],
      "templating": { "list": [] },
      "id": null,
      "title": "Observabilidade - API Oficina",
      "uid": "observ-api",
      "version": 1,
      "schemaVersion": 30,
      "time": { "from": "now-1h", "to": "now" }
    }
