apiVersion: batch/v1
kind: Job
metadata:
  name: mvp-oficina-api-migrations
  namespace: staging
  labels:
    app: mvp-oficina-api-migrations
    environment: staging
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app: mvp-oficina-api-migrations
        job: migrations
    spec:
      restartPolicy: Never
      containers:
        - name: migrations
          # A imagem é substituída no GitHub Actions via envsubst.
          # O workflow define IMAGE_URI com a imagem recém-publicada no ECR usando github.
          image: ${IMAGE_URI}
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              alembic upgrade head
              python scripts/seed_admin.py
          envFrom:
            - secretRef:
                name: mvp-oficina-api-secrets