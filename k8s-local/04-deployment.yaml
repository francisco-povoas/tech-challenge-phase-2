apiVersion: apps/v1
kind: Deployment
metadata:
  name: mvp-oficina-api
  namespace: local
  labels:
    app: mvp-oficina-api
    environment: local
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mvp-oficina-api
  template:
    metadata:
      labels:
        app: mvp-oficina-api
        environment: local
    spec:
      containers:
        - name: mvp-oficina-api
          image: mvp-oficina-api:local
          imagePullPolicy: IfNotPresent
          command:
            - opentelemetry-instrument
            - uvicorn
            - app.main:create_app
            - --factory
            - --host
            - 0.0.0.0
            - --port
            - "8000"
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: mvp-oficina-api-secrets
          env:
            - name: OTEL_SERVICE_NAME
              value: mvp-oficina-api
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.observability.svc.cluster.local:4317
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: grpc
            - name: OTEL_TRACES_EXPORTER
              value: otlp
            - name: OTEL_METRICS_EXPORTER
              value: otlp
            - name: OTEL_METRIC_EXPORT_INTERVAL
              value: "5000"
            - name: OTEL_LOGS_EXPORTER
              value: none
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health-check
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health-check
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
