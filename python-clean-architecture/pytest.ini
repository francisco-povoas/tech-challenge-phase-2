[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
asyncio_default_test_loop_scope = function
markers =
    unit: testes unitários (sem banco, rápidos)
    integration: testes de integração (com banco real)

# Garante que imports funcionem a partir de python-clean-architecture/
pythonpath = .

testpaths = tests
