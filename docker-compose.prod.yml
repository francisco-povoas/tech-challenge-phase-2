services:

  # ─── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: always
    env_file:
      - .env.prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-app_prod}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
      - ./python-clean-architecture/scripts/pg/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-app_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # Em produção, não expor porta do banco localmente
    ports: []

  # ─── API (production) ───────────────────────────────────────────────────────
  api-prod:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    env_file:
      - .env.prod
    working_dir: /app
    command: ["sh", "scripts/start-api.sh", "prod"]
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data_prod:

# ─── Como usar ──────────────────────────────────────────────────────────────────
# docker compose -f docker-compose.prod.yml up

