apiVersion: v1
kind: Service
metadata:
  name: mvp-oficina-api-service
  namespace: local
  labels:
    app: mvp-oficina-api
    environment: local
spec:
  type: NodePort
  selector:
    app: mvp-oficina-api
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8000
      nodePort: 30080
