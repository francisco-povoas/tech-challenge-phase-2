services:
  db:
    image: postgres:16-alpine
    restart: "no"
    env_file:
      - .env.test
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-app_test}
    ports:
      - "5437:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-app_test}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  jaeger:
    image: jaegertracing/jaeger:2.20.0
    restart: "no"
    ports:
      - "16686:16686"
    expose:
      - "4317"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.158.0
    restart: "no"
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./observability/otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"
      - "8889:8889"
    depends_on:
      jaeger:
        condition: service_started

  tests:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.test
    working_dir: /app
    environment:
      DB_URL: postgresql+asyncpg://postgres:postgres@db:5432/app_test
      OTEL_SERVICE_NAME: mvp-oficina-api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_METRIC_EXPORT_INTERVAL: "5000"
      OTEL_LOGS_EXPORTER: none
    command:
      - sh
      - -c
      - |
        alembic upgrade head &&
        python scripts/seed_admin.py &&
        mkdir -p reports &&
        rm -f reports/coverage-integration.xml &&
        COVERAGE_FILE=/tmp/.coverage opentelemetry-instrument pytest -p no:cacheprovider \
          --cov-config=.coveragerc \
          tests/integration/iam \
          tests/integration/clientes \
          tests/integration/veiculos \
          tests/integration/servicos \
          tests/integration/estoque \
          tests/integration/ordens_servico \
          -v \
          --tb=short \
          --cov=app \
          --cov-config=.coveragerc \
          --cov-report=xml:reports/coverage-integration.xml \
    volumes:
      - ./python-clean-architecture:/app
    depends_on:
      db:
        condition: service_healthy
      otel-collector:
        condition: service_started
    restart: "no"

  prometheus:
    image: prom/prometheus:v3.13.1
    restart: "no"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      otel-collector:
        condition: service_started
  grafana:
    image: grafana/grafana:13.1.3
    restart: "no"
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    depends_on:
      - prometheus